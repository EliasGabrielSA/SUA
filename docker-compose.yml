services:
  web:
    build: .
    container_name: sua-web
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:17
    container_name: sua-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sua}
      POSTGRES_USER: ${POSTGRES_USER:-sua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sua} -d ${POSTGRES_DB:-sua}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
