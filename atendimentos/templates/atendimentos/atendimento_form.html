{% extends "base.html" %}

{% block title %}Novo atendimento · SUA{% endblock %}

{% block content %}
    <h1 class="h3 mb-1">Novo atendimento</h1>
    <p class="text-muted mb-4">Paciente: <strong>{{ paciente.nome }}</strong></p>

    <form method="post" novalidate>
        {% csrf_token %}

        {% include "pacientes/_campos.html" with form=form %}

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'pacientes:detalhe' paciente.pk %}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
{% endblock %}
