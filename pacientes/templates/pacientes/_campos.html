{% for campo in form %}
    <div class="mb-3">
        {% if campo.widget_type == "checkbox" %}
            <div class="form-check">
                {{ campo }}
                <label for="{{ campo.id_for_label }}" class="form-check-label">{{ campo.label }}</label>
            </div>
        {% else %}
            <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
            {{ campo }}
        {% endif %}
        {% for erro in campo.errors %}
            <div class="text-danger small">{{ erro }}</div>
        {% endfor %}
    </div>
{% endfor %}
